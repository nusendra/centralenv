services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: centralenv-server:latest
    restart: unless-stopped
    environment:
      MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY in .env or Coolify env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env or Coolify env}
      DATABASE_URL: sqlite:///data/centralenv.db
      BIND_ADDR: 0.0.0.0:3001
      RUST_LOG: ${RUST_LOG:-centralenv_server=info,tower_http=info}
    volumes:
      - centralenv-data:/data
    ports:
      - "${SERVER_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3001/auth/me || [ $$? -eq 8 ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Public URL of the server (browser-visible). Required for two-domain deploys.
        # Leave empty for same-origin / reverse-proxy setups.
        VITE_API_URL: ${VITE_API_URL:-}
    image: centralenv-web:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - server

volumes:
  centralenv-data:
