services:
  server:
    image: ${SERVER_IMAGE:-ghcr.io/nusendra/centralenv-server:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY in .env or Coolify env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env or Coolify env}
      DATABASE_URL: sqlite:///data/centralenv.db
      BIND_ADDR: 0.0.0.0:3001
      RUST_LOG: ${RUST_LOG:-centralenv_server=info,tower_http=info}
    volumes:
      - centralenv-data:/data
    ports:
      - "${SERVER_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3001/auth/me || [ $$? -eq 8 ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    image: ${WEB_IMAGE:-ghcr.io/nusendra/centralenv-web:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Public URL of the server as seen by the browser.
      # Leave empty for same-origin / reverse-proxy setups.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - server

volumes:
  centralenv-data:
